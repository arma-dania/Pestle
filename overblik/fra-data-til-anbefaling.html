<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fra data til anbefaling</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

/* Layout: én kolonne (maks. 1180 px). Øverst scenen (et mørkt "lysbord" i 16:9), derefter storyboard-manuskript, designforslag og brug i undervisningen. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#1b1f24; --muted:#59626d; --line:#d5d9df; --accent:#2b3a4a;
  --s:#1d7a4a; --w:#8f5f00; --o:#2a5ca8; --t:#952f60; --gold:#8a6514;
  --stage:#0f1721; --stage-ink:#e8edf4; --stage-muted:#93a1b3;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:Newsreader,Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}



*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.3rem,5.6vw,4.4rem);line-height:1;font-weight:700}
h2{font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.1;font-weight:650}
h3{font-size:1.15rem;font-weight:650;line-height:1.25}
p{margin:0}
.eyebrow{font:500 12px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:1.2rem;max-width:62ch;color:var(--ink)}
a{color:var(--o)}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}

header.hero{display:grid;gap:18px;padding-block:44px 26px}
.hero .chain{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:500 13px/1 var(--mono);color:var(--muted)}
.hero .chain b{font-weight:600;color:var(--ink)}
.hero .chain .g{color:var(--gold)}

/* Scenen */
.player{background:var(--stage);border-radius:6px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(10,20,35,.55)}
.stagebox{position:relative;width:100%;aspect-ratio:16/9;max-width:100%}
.stagebox canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:12px;
  background:rgba(255,217,138,.95);color:#1b1608;border:0;border-radius:999px;padding:14px 24px 14px 18px;
  font:600 16px/1 var(--display);cursor:pointer;box-shadow:0 10px 40px rgba(255,217,138,.35)}
.bigplay svg{width:20px;height:20px}
.controls{display:flex;align-items:center;gap:12px;padding:10px 14px;color:var(--stage-ink);font:500 13px/1 var(--mono);flex-wrap:wrap}
.controls button{background:transparent;color:var(--stage-ink);border:1px solid rgba(232,237,244,.28);border-radius:4px;
  min-height:36px;min-width:40px;padding:0 10px;font:600 13px/1 var(--mono);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.controls button:hover{border-color:rgba(255,217,138,.8)}
.controls input[type=range]{flex:1;min-width:140px;accent-color:#ffd98a}
.controls .time{font-variant-numeric:tabular-nums;color:var(--stage-muted);min-width:92px;text-align:right}
.scenes{display:flex;gap:2px;padding:0 14px 14px;overflow-x:auto}
.scenes button{flex:1 0 auto;background:rgba(232,237,244,.06);color:var(--stage-muted);border:0;border-top:2px solid transparent;
  padding:8px 10px 9px;text-align:left;font:500 11px/1.25 var(--mono);letter-spacing:.04em;cursor:pointer;min-width:88px}
.scenes button b{display:block;color:var(--stage-ink);font:600 13px/1.2 var(--display);letter-spacing:0;margin-top:3px}
.scenes button.on{border-top-color:#ffd98a;background:rgba(255,217,138,.10)}
.note{font:400 14px/1.5 var(--body);color:var(--muted);margin-top:10px}

section{padding-top:64px;display:grid;gap:22px}
.sechead{display:grid;gap:10px;max-width:70ch}
.idea{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.idea > div{border-top:2px solid var(--ink);padding-top:14px;display:grid;gap:8px;align-content:start}
.idea .k{font:600 13px/1 var(--mono);color:var(--muted)}

/* Manuskript */
.scene{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:26px;padding:26px 0;border-top:1px solid var(--line)}
.scene .thumb{display:grid;gap:10px;align-content:start}
.scene canvas{width:100%;aspect-ratio:16/9;border-radius:4px;background:var(--stage);display:block;cursor:pointer}
.scene .tag{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.scene .num{font:700 34px/1 var(--display);color:var(--ink)}
.scene .tc{font:500 13px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.scene .body{display:grid;gap:16px;min-width:0}
.vo{font:italic 400 1.28rem/1.45 var(--body);border-left:3px solid var(--gold);padding-left:16px;max-width:60ch}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cols h4{margin:0 0 6px;font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cols p,.cols li{font-size:15.5px;line-height:1.5}
.cols ul{margin:0;padding-left:18px}
.pt{font:500 14px/1.45 var(--body);color:var(--muted)}
.pt b{color:var(--ink);font-weight:600}

/* Design */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;gap:12px;align-content:start;min-width:0}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw div{border-radius:4px;padding:52px 10px 10px;font:500 12px/1.35 var(--mono);color:#e8edf4;min-height:96px}
.sw div b{display:block;font:600 14px/1.2 var(--display);margin-bottom:2px}
.type1{font:700 44px/1 var(--display)}
.type2{font:italic 400 26px/1.3 var(--body)}
.type3{font:500 13px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase}
dl.rules{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:10px 18px;margin:0}
dl.rules dt{font:600 15px/1.35 var(--display)}
dl.rules dd{margin:0;font-size:15.5px}
.glyphs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.glyphs div{display:grid;gap:4px;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.glyphs b{font:600 14px/1.2 var(--display)}
.glyphs span{font-size:14px;color:var(--muted);line-height:1.4}
table.snd{width:100%;border-collapse:collapse;font-size:15px}
table.snd th{font:600 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
table.snd td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
ol.stops{margin:0;padding-left:22px;display:grid;gap:10px;max-width:72ch}
.foot{font-size:14.5px;color:var(--muted);max-width:75ch;display:grid;gap:8px}
.chipS{color:var(--s)} .chipW{color:var(--w)} .chipO{color:var(--o)} .chipT{color:var(--t)}

@media (max-width:860px){
  .scene{grid-template-columns:minmax(0,1fr)}
  .cols{grid-template-columns:minmax(0,1fr)}
  .idea{grid-template-columns:minmax(0,1fr)}
  .grid2{grid-template-columns:minmax(0,1fr)}
  dl.rules{grid-template-columns:minmax(0,1fr)}
  dl.rules dd{margin-bottom:8px}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }

:root{color-scheme:light}
/* Indlejret på fanen Overblik: ingen sidemargen, baggrund som SWOT shop */
body{margin:0;padding:0;background:transparent}
.note{margin-top:10px;font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<div class="player" id="player">
  <div class="stagebox">
    <canvas id="stage" tabindex="0" aria-label="Animation: Fra data til anbefaling. Mellemrum afspiller og pauser, piletasterne skifter scene."></canvas>
    <button class="bigplay" id="bigplay" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3l12 7-12 7z" fill="currentColor"/></svg>Afspil fra start</button>
  </div>
  <div class="controls">
    <button id="pp" type="button" aria-label="Afspil">▶</button>
    <button id="prev" type="button" aria-label="Forrige scene">◀◀</button>
    <button id="next" type="button" aria-label="Næste scene">▶▶</button>
    <input id="scrub" type="range" min="0" max="154" step="0.05" value="144" aria-label="Tidslinje">
    <span class="time" id="time">2:24 / 2:34</span>
  </div>
  <div class="scenes" id="scenes"></div>
</div>
<p class="note">Klik på scenen for at afspille eller pause. Mellemrum afspiller, og piletasterne springer mellem scenerne. Animationen er uden lyd, og speaken står som undertekster.</p>
<!-- Manuskriptet bruges kun til scenebillederne i den fulde version og vises ikke her -->
<div id="script" hidden></div>
<script>
(() => {
'use strict';
const SW = 1600, SH = 900, DUR = 154;
const C = { x: 0, y: 1050 };            // centrum for analyseringene
const R_CORE = 300, R_MICRO = 640, R_MACRO = 980;
const COL = { S: '#4cc68a', W: '#e8b04a', O: '#70a6f6', T: '#ec79ab' };

const F = { disp: '"Bricolage Grotesque","Segoe UI",system-ui,sans-serif', body: 'Newsreader,Georgia,serif', mono: '"IBM Plex Mono",ui-monospace,monospace' };

const SCENES = [

  [115.5, 118.5, 'Hvad siger forventningerne om den nærmeste fremtid?'],
  [118.5, 122.5, 'Og vigtigst: Hvad betyder det for jeres virksomhed?'],
  [122.5, 130, 'Under de andre bogstaver tager I kun det med, der rammer branchen og har en konsekvens.'],
  [130.3, 134.5, 'Nu går vi forlæns.'],
  [134.5, 138.5, 'Hvert fund får sin plads i SWOT’en.'],
  [138.5, 141.5, 'De vigtigste kobles i TOWS.'],
  [141.5, 145, 'De bedste alternativer bliver jeres anbefalinger.'],
  [145.3, 149.5, 'Kan I ikke pege på, hvor et punkt kommer fra, er det et gæt.'],
  [149.5, 154, 'Semestrets opgave er at gøre gæt til dokumentation.'],
];

// Kamera: [t, x, y, zoom]
const CAM = [
  [0, 0, -1500, 1.15], [10.5, 0, -1500, 1.15], [14, 0, -1330, 0.8], [19, 0, 160, 0.225], [23.6, 0, 160, 0.225],
  [26.6, 0, -905, 1.0], [37.6, 0, -905, 1.0], [40.2, 0, -300, 1.05], [51.6, 0, -300, 1.05],
  [55, 0, 1050, 1.32], [73.6, 0, 1050, 1.32], [77, 0, 1050, 0.68], [82.6, 0, 1050, 0.68], [84.2, -500, 1080, 1.0], [91.8, -500, 1080, 1.0],
  [93.4, 500, 1080, 1.0], [98.6, 500, 1080, 1.0], [100.4, 0, 1050, 0.62], [102.6, 0, 1050, 0.445], [106, 0, 1050, 0.445], [108.2, 1330, 1050, 1.0], [120.2, 1330, 1050, 1.0],
  [122.8, 0, 1050, 0.445], [130, 0, 1050, 0.445], [133.2, 450, 160, 0.225], [145, 450, 160, 0.225],
  [148.6, 0, -1430, 0.95], [154, 0, -1430, 0.95],
];

// ---------- små hjælpere ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const eback = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const vis = (t, a, b = Infinity, fi = .6, fo = .6) => Math.min(seg(t, a, a + fi), b === Infinity ? 1 : 1 - seg(t, b - fo, b));
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

let ctx = null, K = 1;
function withA(a, fn) { if (a <= 0.002) return; const p = ctx.globalAlpha; ctx.globalAlpha = p * Math.min(1, a); fn(); ctx.globalAlpha = p; }
function font(sz, fam = 'disp', w = 500, it = false) { ctx.font = `${it ? 'italic ' : ''}${w} ${sz}px ${F[fam]}`; }
const hasLS = () => 'letterSpacing' in ctx;
function txt(s, x, y, sz, col, o = {}) {
  font(sz, o.f || 'disp', o.w || 500, o.it); ctx.fillStyle = col; ctx.textAlign = o.al || 'left'; ctx.textBaseline = o.bl || 'alphabetic';
  if (o.ls && hasLS()) ctx.letterSpacing = o.ls + 'px';
  ctx.fillText(s, x, y);
  if (o.ls && hasLS()) ctx.letterSpacing = '0px';
}
function caps(s, x, y, sz, col, o = {}) { txt(s.toUpperCase(), x, y, sz, col, Object.assign({ f: 'mono', w: 500, ls: sz * 0.14 }, o)); }
function tw(s, sz, fam = 'disp', w = 500, it = false) { font(sz, fam, w, it); return ctx.measureText(s).width; }
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function glow(col, b) { ctx.shadowColor = col; ctx.shadowBlur = b * K; }
function noglow() { ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; }
function line(pts, col, w, dash) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]); }
function circle(x, y, r, fill, stroke, lw) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); } }
function bez(p0, p1, p2, p3, u) { const v = 1 - u; return [v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0], v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]]; }
function curve(p0, p3, prog, col, w, dash, bend = 0.5) {
  const dy = p3[1] - p0[1]; const p1 = [p0[0], p0[1] + dy * bend], p2 = [p3[0], p3[1] - dy * bend];
  const n = 40, pts = []; for (let i = 0; i <= n * prog; i++) pts.push(bez(p0, p1, p2, p3, i / n));
  if (pts.length > 1) line(pts, col, w, dash);
  return pts[pts.length - 1];
}
const typed = (s, u) => s.slice(0, Math.round(s.length * clamp(u)));

// Chip med fund: bogstav, id og tekst. y er midten.
function chip(x, y, L, id, text, a, al = 'left', sz = 19, sc = 1) {
  const col = COL[L] || GOLD; const idw = tw(id, sz * .8, 'mono', 600) + 16; const w = tw(text, sz, 'body', 500) + idw + 30; const h = sz * 2.1;
  const x0 = al === 'left' ? x : al === 'right' ? x - w : x - w / 2;
  withA(a, () => {
    ctx.save(); ctx.translate(x0 + w / 2, y); ctx.scale(sc, sc); ctx.translate(-(x0 + w / 2), -y);
    rr(x0, y - h / 2, w, h, h / 2); ctx.fillStyle = 'rgba(13,20,29,0.94)'; ctx.fill(); ctx.strokeStyle = rgba(col, .75); ctx.lineWidth = 1.5; ctx.stroke();
    rr(x0 + 6, y - h / 2 + 6, idw, h - 12, (h - 12) / 2); ctx.fillStyle = col; ctx.fill();
    txt(id, x0 + 6 + idw / 2, y + 1, sz * .8, '#0d141d', { f: 'mono', w: 600, al: 'center', bl: 'middle' });
    txt(text, x0 + idw + 18, y + 1, sz, INK, { f: 'body', w: 500, bl: 'middle' });
    ctx.restore();
  });
  return { x0, w, h };
}

// ---------- kamera ----------
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && t >= CAM[i + 1][0]) i++;
  const a = CAM[i], b = CAM[i + 1]; const u = eio(seg(t, a[0], b[0]));
  return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u), z: Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), u)) };
}

// ---------- data ----------
const REC = { cx: 0, cy: -1500, w: 1040, h: 400 };
const REC_LINES = [
  { text: 'Vind erhvervskunderne med 10 års garanti', ref: 'SO', refs: 'S1 + O2' },
  { text: 'Gør webshoppen til en styrke', ref: 'WO', refs: 'W1 + O1' },
  { text: 'Tilbyd leasing, når renten stiger', ref: 'ST', refs: 'S3 + T2' },
];
const recLineY = i => -1488 + i * 74;

const TW = { x0: -480, hw: 180, cw: 390, y0: -1115, hh: 60, rh: 175 };
const TCELL = {
  SO: { x: -300, y: -1055 }, WO: { x: 90, y: -1055 }, ST: { x: -300, y: -880 }, WT: { x: 90, y: -880 },
};

// ---------- baggrund ----------
function drawBG(cam) {
  const W = SW * K, H = SH * K;
  const g = ctx.createRadialGradient(W * .5, H * .42, 0, W * .5, H * .42, W * .78);
  g.addColorStop(0, '#162231'); g.addColorStop(1, '#0a1017');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const s = 40 * K, ox = ((-cam.x * cam.z * .25 * K) % s + s) % s, oy = ((-cam.y * cam.z * .25 * K) % s + s) % s;
  ctx.fillStyle = 'rgba(190,208,232,0.07)';
  for (let x = ox; x < W; x += s) for (let y = oy; y < H; y += s) ctx.fillRect(x, y, 1.2 * K, 1.2 * K);
}

// ---------- ikoner til den interne analyse ----------
function icon(kind, x, y, t, t0) {
  const s = WARM; ctx.strokeStyle = s; ctx.fillStyle = s; ctx.lineWidth = 1.6;
  const u = seg(t, t0 + .2, t0 + 1.4);
  if (kind === 'vrio') {
    'VRIO'.split('').forEach((ch, i) => {
      const bx = x - 46 + i * 24; rr(bx, y - 14, 20, 24, 3); ctx.stroke();
      txt(ch, bx + 10, y - 1, 12, INK, { f: 'mono', w: 600, al: 'center', bl: 'middle' });
      if (u > (i + 1) / 5) circle(bx + 17, y - 14, 4, COL.S);
    });
  } else if (kind === 'bmc') {
    rr(x - 44, y - 18, 88, 36, 2); ctx.stroke();
    [-26.4, -8.8, 8.8, 26.4].forEach(dx => line([[x + dx, y - 18], [x + dx, y + 8]], s, 1.2));
    line([[x - 44, y + 8], [x + 44, y + 8]], s, 1.2); line([[x, y + 8], [x, y + 18]], s, 1.2);
    line([[x - 44, y - 5], [x - 26.4, y - 5]], s, 1); line([[x + 26.4, y - 5], [x + 44, y - 5]], s, 1);
  } else if (kind === 'vpc') {
    rr(x - 44, y - 17, 34, 34, 3); ctx.stroke(); circle(x + 27, y, 17, null, s, 1.6);
    line([[x - 6, y], [x + 6, y]], s, 1.6); line([[x + 2, y - 4], [x + 6, y], [x + 2, y + 4]], s, 1.6);
  } else if (kind === 'chain') {
    for (let i = 0; i < 3; i++) line([[x - 44, y - 18 + i * 6], [x + 22, y - 18 + i * 6]], s, 1);
    ctx.beginPath(); ctx.moveTo(x - 44, y - 2); ctx.lineTo(x + 26, y - 2); ctx.lineTo(x + 44, y + 7); ctx.lineTo(x + 26, y + 16); ctx.lineTo(x - 44, y + 16); ctx.closePath(); ctx.stroke();
    [-24, -4, 16].forEach(dx => line([[x + dx, y - 2], [x + dx, y + 16]], s, 1));
  } else if (kind === 'fin') {
    const h1 = 36 * u, h2 = 25 * u;
    ctx.fillStyle = COL.S; ctx.fillRect(x - 24, y + 18 - h1, 18, h1);
    ctx.fillStyle = 'rgba(200,214,232,0.45)'; ctx.fillRect(x + 6, y + 18 - h2, 18, h2);
    line([[x - 36, y + 18], [x + 36, y + 18]], s, 1.2);
    withA(u, () => { txt('41', x - 15, y - 24 + (36 - h1), 11, INK, { f: 'mono', al: 'center' }); txt('28', x + 15, y - 13 + (25 - h2), 11, MUTED, { f: 'mono', al: 'center' }); });
  } else if (kind === 'org') {
    rr(x - 13, y - 20, 26, 14, 3); ctx.stroke();
    line([[x, y - 6], [x, y + 1]], s, 1.4); line([[x - 30, y + 1], [x + 30, y + 1]], s, 1.4);
    [-30, 0, 30].forEach((dx, i) => { line([[x + dx, y + 1], [x + dx, y + 6]], s, 1.4); rr(x + dx - 11, y + 6, 22, 13, 3); if (u > (i + 1) / 4) { ctx.fillStyle = rgba(WARM, .55); ctx.fill(); } ctx.stroke(); });
  }
}

function annulus(r1, r2, fill) { ctx.beginPath(); ctx.arc(C.x, C.y, r2, 0, Math.PI * 2); ctx.arc(C.x, C.y, r1, 0, Math.PI * 2, true); ctx.fillStyle = fill; ctx.fill('evenodd'); }
function drawRings(t) {
  const gh = seg(t, 16, 18.5); if (!gh) return;
  withA(gh, () => {
    [R_CORE, R_MICRO, R_MACRO].forEach(r => circle(C.x, C.y, r, null, 'rgba(200,214,232,0.22)', 1.5));
  });
  // overblikstekster i ringene
  const ov = Math.max(vis(t, 18.5, 24.5, .8, .8), vis(t, 131.5, 146, 1, 1));
  withA(ov, () => {
    txt('Intern', C.x, C.y + 20, 74, rgba(WARM, .95), { w: 650, al: 'center' });
    txt('Mikro', C.x, C.y - 470 + 30, 74, COOL, { w: 650, al: 'center' });
    txt('Makro', C.x, C.y - 810 + 30, 74, COOL, { w: 650, al: 'center' });
  });

  // kerne
  const core = seg(t, 52.4, 54.4);
  if (core) withA(core, () => {
    const g = ctx.createRadialGradient(C.x, C.y, 0, C.x, C.y, R_CORE);
    g.addColorStop(0, 'rgba(232,176,74,0.20)'); g.addColorStop(1, 'rgba(232,176,74,0.04)');
    circle(C.x, C.y, R_CORE, g, rgba(WARM, .55), 2);
  });
  // mikro
  const mic = seg(t, 74.4, 76.6);
  if (mic) withA(mic, () => { annulus(R_CORE, R_MICRO, 'rgba(112,166,246,0.07)'); circle(C.x, C.y, R_MICRO, null, rgba(COL.O, .5), 2); });
  // makro: seks segmenter
  PEST.forEach((p, i) => {
    const u = eout(seg(t, 100.4 + i * .22, 101.5 + i * .22)); if (!u) return;
    const a0 = (p.a - 29) * Math.PI / 180, a1 = a0 + 58 * u * Math.PI / 180;
    const act = p.L === 'E' && i === 1 ? vis(t, 106.2, 121.6, .4, .8) : vis(t, p.on, p.on + 1.6, .3, .6);

      const aa = back ? seg(t, n.t - .2, n.t + .4) * back : fwd;
      withA(aa, () => {
        const xm = -1420; line([[xm, ya], [xm, yb]], 'rgba(200,214,232,0.4)', 4);
        if (back) { line([[xm - 22, yb - 30], [xm, yb], [xm + 22, yb - 30]], 'rgba(200,214,232,0.6)', 4); }
        else { line([[xm - 22, ya + 30], [xm, ya], [xm + 22, ya + 30]], rgba(GOLD, .8), 4); }
        txt(back ? 'kommer fra' : 'bliver til', xm - 34, (ya + yb) / 2 + 16, 46, back ? MUTED : GOLD, { f: 'body', it: true, al: 'right' });
      });
    }
  });
  // sprintmærker (kun forlæns)
  withA(seg(t, 132.4, 133.4) * fwd, () => {
    const sp = [
      { y: -930, h: 'Sprint 4', s: 'TOWS: vurdér og vælg', c: INK },
      { y: 760, h: 'Sprint 2', s: 'intern analyse → S og W', c: WARM },
      { y: 1110, h: 'Sprint 3', s: 'kunder og marked → O og T', c: COOL },
      { y: 1460, h: 'Sprint 4', s: 'PESTLE, konjunktur, 5 Forces → O og T', c: COOL },

}

// ---------- 8 · fundene flyver op ----------
function drawFlights(t) {
  if (t < 133.4 || t > 146) return;
  FLIGHT.forEach((id, i) => {
    const t0 = 133.6 + i * .3, d = 1.7; const u = seg(t, t0, t0 + d); if (!u || u >= 1) return;
    const p0 = TAGS[id](), p3 = spAnchor(id); const L = id[0];
    const side = p0[0] > p3[0] ? 1 : -1; const p1 = [p0[0] + side * 500, p0[1] - 500], p2 = [p3[0] + side * 300, p3[1] + 700];
    for (let k = 10; k >= 0; k--) {
      const uu = eio(clamp(u - k * .022)); const p = bez(p0, p1, p2, p3, uu);
      withA((1 - k / 11) * .9, () => { if (!k) glow(COL[L], 24); circle(p[0], p[1], k ? 14 - k : 22, COL[L]); noglow(); });
    }
  });
  // fra SWOT til TOWS
  TOWS.forEach((c, ci) => {
    const t0 = 138.3 + ci * .4; const u = eio(seg(t, t0, t0 + 1)); if (!u) return;
    const fade = 1 - seg(t, 143, 145);
    const cell = TCELL[c.k]; const tgt = [cell.x + 195, cell.y + 140];
    c.refs.forEach(id => withA(fade * (c.chosen ? 1 : .45), () => { glow(COL[id[0]], 14); curve(spAnchor(id), tgt, u, rgba(COL[id[0]], .9), 5, null, .5); noglow(); }));
  });
  // fra de valgte til anbefalingerne
  TOWS.filter(c => c.chosen).forEach((c, ci) => {
    const t0 = 140.4 + ci * .35; const u = eio(seg(t, t0, t0 + .9)); if (!u) return;
    const cell = TCELL[c.k]; const fade = 1 - seg(t, 144, 146);
    withA(fade, () => { glow(GOLD, 18); curve([cell.x + 195, cell.y + 10], [400, recLineY(c.rec) + 17], u, rgba(GOLD, .95), 6, null, .5); noglow(); });
  });
}

// ---------- overlay ----------
function sceneAt(t) { let i = 0; while (i < SCENES.length - 1 && t >= SCENES[i + 1].t) i++; return i; }
function drawOverlay(t) {
  withA(seg(t, 148.6, 150.2), () => {
    const g2 = ctx.createLinearGradient(0, 560, 0, 700); g2.addColorStop(0, 'rgba(10,16,23,0)'); g2.addColorStop(1, 'rgba(10,16,23,0.97)');
    ctx.fillStyle = g2; ctx.fillRect(0, 560, SW, 140); ctx.fillStyle = 'rgba(10,16,23,0.97)'; ctx.fillRect(0, 700, SW, 200);
  });
  const i = sceneAt(t), s = SCENES[i];
  if (i < 8) {
    caps(`${String(i + 1).padStart(2, '0')} · ${s.title}`, 44, 56, 15, INK, { w: 600 });
    if (s.sub) txt(s.sub, 44, 82, 19, MUTED, { f: 'body', it: true });
  }
  // bundtekst
  const sub = SUBS.find(x => t >= x[0] && t < x[1]);
  const g = ctx.createLinearGradient(0, 720, 0, 900); g.addColorStop(0, 'rgba(8,13,19,0)'); g.addColorStop(1, 'rgba(8,13,19,0.78)');
  ctx.fillStyle = g; ctx.fillRect(0, 720, SW, 180);
  if (sub) {
    const a = Math.min(seg(t, sub[0], sub[0] + .35), 1 - seg(t, sub[1] - .3, sub[1]));
    withA(a, () => txt(sub[2], SW / 2, 846, 31, INK, { f: 'body', it: true, w: 400, al: 'center' }));
  }
  // slutbillede
  withA(seg(t, 149.4, 150.6), () => {
    caps('Semestret på ét kort', SW / 2, 664, 16, GOLD, { al: 'center', w: 600 });
    txt('Fra data til anbefaling', SW / 2, 728, 60, INK, { w: 700, al: 'center' });
  });
  // tidslinje-hårstreg
  ctx.fillStyle = 'rgba(232,237,244,0.10)'; ctx.fillRect(0, SH - 4, SW, 4);
  ctx.fillStyle = rgba(GOLD, .8); ctx.fillRect(0, SH - 4, SW * t / DUR, 4);
}

// ---------- tegn ét billede ----------
function render(c, t) {
  ctx = c.getContext('2d'); K = c.width / SW;
  ctx.setTransform(1, 0, 0, 1, 0, 0); noglow(); ctx.globalAlpha = 1;
  const cam = camAt(t);
  drawBG(cam);
  ctx.setTransform(K * cam.z, 0, 0, K * cam.z, K * (SW / 2 - cam.x * cam.z), K * (SH / 2 - cam.y * cam.z));
  drawSpine(t); drawLevels(t); drawRings(t); drawSwot(t); drawTows(t); drawRec(t); drawFlights(t);
  ctx.setTransform(K, 0, 0, K, 0, 0);
  drawOverlay(t);
}

const cv = document.getElementById('stage');
const pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
const big = document.getElementById('bigplay'), scenesEl = document.getElementById('scenes');
let T = 144.2, playing = false, last = 0;
const fmt = s => { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; };   // aldrig negativ tid lige ved start
SCENES.forEach((s, i) => {
  const b = document.createElement('button'); b.type = 'button';
  b.innerHTML = `${String(i + 1).padStart(2, '0')} · ${fmt(s.t)}<b>${s.title}</b>`;
  b.addEventListener('click', () => { T = s.t + .01; big.hidden = true; play(); });
  scenesEl.appendChild(b);
});
function size() {
  const r = cv.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(320, Math.round(r.width * dpr)); if (cv.width !== w) { cv.width = w; cv.height = Math.round(w * 9 / 16); }
}
function ui() {
  scrub.value = T; timeEl.textContent = `${fmt(T)} / ${fmt(DUR)}`;
  pp.textContent = playing ? '❚❚' : '▶'; pp.setAttribute('aria-label', playing ? 'Pause' : 'Afspil');
  const si = sceneAt(T); [...scenesEl.children].forEach((b, i) => b.classList.toggle('on', i === si));
}
function frame(now) {
  if (playing) { T += Math.min(.1, (now - last) / 1000); if (T >= DUR) { T = DUR; playing = false; } }
  last = now; size(); render(cv, T); ui();
  if (playing) requestAnimationFrame(frame);
}
function play() { if (T >= DUR - .05) T = 0; playing = true; big.hidden = true; last = performance.now(); requestAnimationFrame(frame); }
function pause() { playing = false; requestAnimationFrame(frame); }
function toggle() { playing ? pause() : play(); }
pp.addEventListener('click', toggle);
cv.addEventListener('click', toggle);
big.addEventListener('click', () => { T = 0; play(); });
scrub.addEventListener('input', () => { T = +scrub.value; big.hidden = true; if (!playing) requestAnimationFrame(frame); });
const jump = d => { const i = clamp(sceneAt(T) + d, 0, SCENES.length - 1); T = SCENES[i].t + .01; big.hidden = true; if (!playing) requestAnimationFrame(frame); };
document.getElementById('prev').addEventListener('click', () => jump(-1));
document.getElementById('next').addEventListener('click', () => jump(1));
cv.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); jump(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); jump(-1); }
});
window.addEventListener('resize', () => requestAnimationFrame(frame));
